<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Foule en Furie – Défense</title>
<style>
  /* ---------- Mise en page : canvas centré sur fond sombre ---------- */
  :root { --bg:#bfe6f7; --panel:#6b4426; --line:#3b2412; --teal:#fff3b0; --gold:#ffd54a; --text:#ffffff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:linear-gradient(#dff3fc,#a9d9ef); color:var(--text);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; overflow:hidden;
    -webkit-user-select:none; user-select:none; }
  #app { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:6px; }
  #wrap { --w:min(100vw - 12px, (100dvh - 175px) * 0.6); width:var(--w); }
  canvas { display:block; width:100%; aspect-ratio:3/5; background:#0e1420; border:4px solid var(--line);
    border-radius:14px; touch-action:none; cursor:crosshair; }
  #shop { width:var(--w); display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:8px; }
  #shop button { grid-column:span 2; }
  #shop #b-tur, #shop #b-mg { grid-column:span 3; }
  #shop button, #b-pause { font:inherit; color:var(--text); background:var(--panel); border:3px solid var(--line);
    border-radius:12px; padding:8px 4px; text-shadow:0 1px 2px rgba(0,0,0,.6); cursor:pointer; line-height:1.25; transition:transform .08s, border-color .15s; }
  #shop button b, #b-pause b { display:block; font-size:clamp(13px,3.4vw,16px); }
  #shop button span, #b-pause span { font-size:clamp(11px,3vw,14px); color:var(--gold); }
  #shop button:not(:disabled):hover, #b-pause:hover { border-color:var(--teal); }
  #shop button:not(:disabled):active, #b-pause:active { transform:scale(.96); }
  #shop button:disabled { opacity:.45; cursor:not-allowed; }
  #shop button.can { border-color:var(--gold); box-shadow:0 0 12px rgba(255,209,102,.35); }
  #shop button:focus-visible, #b-pause:focus-visible { outline:3px solid var(--teal); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { #shop button, #b-pause { transition:none; } }
  #stage { position:relative; }
  #b-ult { position:absolute; right:3%; bottom:15%; width:clamp(50px,16%,66px); aspect-ratio:1; border-radius:50%;
    border:3px solid var(--line); padding:0; display:grid; place-items:center; cursor:pointer; color:#fff;
    background:conic-gradient(var(--gold) var(--p,0deg), #3b2412 0); box-shadow:0 3px 8px rgba(0,0,0,.45);
    font:800 clamp(14px,4vw,20px) "Trebuchet MS",sans-serif; }
  #b-ult span { display:grid; place-items:center; width:78%; height:78%; border-radius:50%; background:#5a3a1e; font-size:clamp(16px,5vw,24px); }
  #b-ult:disabled { cursor:not-allowed; }
  #b-ult.ready { animation:ultpulse 1.2s infinite; }
  #b-ult:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  @keyframes ultpulse { 50% { box-shadow:0 0 16px 6px rgba(255,213,74,.9); } }
  #draft { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:rgba(20,40,60,.78); border-radius:10px; padding:12px; text-align:center; }
  #draft[hidden] { display:none; }
  #draft-title { font-weight:800; font-size:clamp(17px,4.8vw,24px); text-shadow:0 2px 4px #000; }
  #cards { display:flex; flex-direction:column; gap:10px; width:94%; }
  .card { font:inherit; color:#fff; background:var(--panel); border:3px solid var(--line); border-radius:12px; padding:10px 12px;
    display:flex; gap:12px; align-items:center; text-align:left; cursor:pointer; transition:transform .1s, border-color .15s; }
  .card:hover, .card:focus-visible { border-color:var(--gold); outline:none; transform:scale(1.02); }
  .card i { font-style:normal; font-size:30px; }
  .card b { display:block; font-size:clamp(14px,4vw,18px); }
  .card small { color:#e8d7b8; font-size:clamp(11px,3.2vw,14px); }
  .card em { margin-left:auto; font-style:normal; font-size:12px; color:var(--gold); white-space:nowrap; }
  @media (prefers-reduced-motion: reduce) { #b-ult.ready { animation:none; } .card { transition:none; } }
</style>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-8M74ZQC2H3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-8M74ZQC2H3');

</head>
<body>
<div id="app">
  <div id="wrap">
    <div id="stage">
      <canvas id="game" aria-label="Zone de jeu"></canvas>
      <button id="b-ult" aria-label="Frappe aérienne (touche U)" title="Frappe aérienne (touche U)"></button>
      <div id="draft" hidden><div id="draft-title"></div><div id="cards"></div></div>
    </div>
    <div id="shop">
      <button id="b-dmg"  data-k="dmg"  title="Touche 1"></button>
      <button id="b-rate" data-k="rate" title="Touche 2"></button>
      <button id="b-gun"  data-k="gun"  title="Touche 3"></button>
      <button id="b-tur"  data-k="tur"  title="Touche 4"></button>
      <button id="b-mg"   data-k="mg"   title="Touche 5"></button>
      <button id="b-pause" style="grid-column:span 6;" title="Pause (Touche P)"><b>⏸️ Pause / Reprendre</b><span>Gérer la partie</span></button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

const W = 480, H = 800;
const DEF_Y = H - 100;
const PLAYER_Y = H - 52;
const MAX_LIVES = 5;

const WEAPONS = [
  { name:'Pistolet',    shots:1, spread:0,    color:'#ffe27a' },
  { name:'Double tir',  shots:2, spread:0.10, color:'#ffd166' },
  { name:'Triple tir',  shots:3, spread:0.16, color:'#9dffb0' },
  { name:'Éventail',    shots:4, spread:0.26, color:'#7df0ff' },
  { name:'Rafale',      shots:5, spread:0.32, color:'#ff9de2' },
  { name:'Plasma',      shots:7, spread:0.44, color:'#ffffff' },
];
const MAX_STAT = 15;
const COST = {
  dmg:  lv => Math.round(10 * Math.pow(1.55, lv - 1)),
  rate: lv => Math.round(14 * Math.pow(1.6,  lv - 1)),
  gun:  lv => Math.round(45 * Math.pow(2.3,  lv - 1)),
  tur:  lv => Math.round(60 * Math.pow(1.7,  lv)),
  mg:   lv => Math.round(90 * Math.pow(1.75, lv)),
};
const MAX_AUX = 8;
const TIER_T = ['Bois', 'Renforcée', 'Métal', 'Béton armé'];
const ICON_T = ['🪵', '🔩', '🛡️', '🏗️'];
const TIER_M = ['Support basique', 'Trépied acier', 'Double canon', 'Triple blindée'];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

const MUTE = { x: 170, y: 23 };
const SFX = (() => {
  let ac = null, master = null, nb = null, mus = null, muted = false, nextT = 0, stepN = 0;
  const last = {};
  try { muted = localStorage.getItem('foule-muted') === '1'; } catch (e) {}
  const ok = (k, gap) => { if (!ac || muted) return false; const n = ac.currentTime; if (n - (last[k] || 0) < gap) return false; last[k] = n; return true; };
  const tone = (type, f0, f1, d, v, at = 0, out = master) => {
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.02);
  };
  const noise = (d, v, f0, f1, at = 0, out = master) => {
    const t = ac.currentTime + at, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; fl.type = 'lowpass'; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02);
  };
  const seq = (type, notes, step, d, v) => notes.forEach((f, i) => tone(type, f, f, d, v, i * step));
  const CH = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const STEP = 60 / 140 / 2;
  function playStep(i, at) {
    const c = CH[(i >> 3) & 3];
    if (i % 4 === 0) tone('sine', 150, 45, .12, .8, at, mus);
    if (i % 2 === 0) tone('square', mf(c[0] - 12), mf(c[0] - 12), STEP * 1.6, .5, at, mus);
    const a = mf(c[[0, 1, 2, 1][i & 3]] + 12);
    tone('triangle', a, a, STEP * .9, .45, at, mus);
    if (i % 8 === 0) tone('square', mf(c[2] + 24), mf(c[2] + 24), STEP * 3, .16, at, mus);
    if (i % 2) noise(.03, .25, 9000, 5000, at, mus);
  }
  function schedule() {
    if (!ac || ac.state !== 'running') return;
    const now = ac.currentTime;
    if (nextT < now) nextT = now + 0.05;
    while (nextT < now + 0.25) { if (!muted) playStep(stepN, nextT - now); stepN++; nextT += STEP; }
  }
  return {
    get muted() { return muted; },
    init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
      nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      mus = ac.createGain(); mus.gain.value = 0.2; mus.connect(master);
      nextT = ac.currentTime + 0.1; setInterval(schedule, 40);
      document.addEventListener('visibilitychange', () => { if (document.hidden) ac.suspend(); else ac.resume(); });
    },
    toggle() {
      muted = !muted; try { localStorage.setItem('foule-muted', muted ? '1' : '0'); } catch (e) {}
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.5, ac.currentTime, 0.02);
    },
    shoot()  { if (ok('s', .035)) tone('square', 1200, 500, .06, .035); },
    turret() { if (ok('t', .08)) { tone('triangle', 200, 55, .16, .16); noise(.1, .08, 1500, 200); } },
    mg()     { if (ok('m', .03)) { tone('square', 700, 350, .035, .03); noise(.03, .04, 4000, 1500); } },
    hit()    { if (ok('h', .04)) tone('sine', 260, 110, .05, .06); },
    kill(boss) { if (ok(boss ? 'kb' : 'k', boss ? .2 : .05)) { noise(boss ? .6 : .14, boss ? .25 : .1, 2500, 150); tone('sine', boss ? 160 : 300, 40, boss ? .5 : .15, boss ? .25 : .08); } },
    coin()   { if (ok('c', .06)) { tone('square', 988, 988, .07, .04); tone('square', 1319, 1319, .12, .04, .07); } },
    hurt()   { if (ok('u', .1)) { tone('sawtooth', 220, 70, .25, .1); noise(.2, .12, 1200, 100); } },
    over()   { if (ok('o', 1)) seq('sawtooth', [330, 262, 196, 131], .28, .3, .09); },
    buy()    { if (ok('b', .08)) seq('triangle', [523, 784], .08, .14, .07); },
    power()  { if (ok('p', .1)) seq('sine', [523, 659, 784, 1047], .06, .14, .08); },
    boom()   { if (ok('x', .2)) { noise(.8, .35, 3000, 60); tone('sine', 120, 30, .7, .3); } },
    zone()   { if (ok('z', .5)) { noise(.7, .15, 400, 5000); tone('sawtooth', 110, 440, .6, .05); } },
    alarm()  { if (ok('a', .5)) seq('square', [880, 660, 880, 660], .1, .09, .06); },
    clear()  { if (ok('w', .3)) seq('triangle', [523, 659, 784, 1047], .09, .16, .08); },
    wave(boss) { if (ok('v', .3)) { if (boss) { tone('sawtooth', 110, 90, .6, .1); tone('sawtooth', 82, 70, .7, .1, .3); } else tone('triangle', 330, 440, .18, .07); } },
  };
})();

let S;
let mode = 'menu';
let overAt = 0;
let best = 0;
try { best = +localStorage.getItem('foule-best') || 0; } catch (e) {}

function reset() {
  S = {
    t: 0, coins: 15, score: 0, lives: MAX_LIVES, wave: 0,
    dmgLv: 1, rateLv: 1, gunLv: 1,
    px: W / 2, tx: W / 2, cd: 0,
    bullets: [], enemies: [], parts: [], floats: [],
    waveTimer: 1.2, banner: null, shake: 0, hurt: 0,
    turLv: 0, mgLv: 0, tcd: 0, mcd: 0, tflash: 0, mflash: 0,
    powerups: [], rcoins: [], rings: [], fly: [], rapid: 0, rain: null, puTimer: 9, flash: 0, rest: 1.2, cleared: true,
    theme: 0, prevTheme: 0, fade: 0, zone: null, ultCd: 20, strikes: [], slowT: 0, offers: [],
    perks: { crit: 0, gold: 0, haste: 0, power: 0 }, temp: { explo: 0, slow: 0 },
    tang: -Math.PI / 2, mang: -Math.PI / 2,
  };
}
reset();

const dmg      = () => (1 + (S.dmgLv - 1) * 0.7 + (S.gunLv - 1) * 0.25) * powMul();
const rapidMul = () => (S.rapid > 0 ? 0.5 : 1) * Math.max(0.5, 1 - 0.12 * S.perks.haste);
const powMul = () => 1 + 0.2 * S.perks.power, critChance = () => 0.1 + 0.08 * S.perks.crit, goldMul = () => 1 + 0.25 * S.perks.gold;
const interval = () => Math.max(0.05, 0.38 * Math.pow(0.88, S.rateLv - 1)) * rapidMul();
const TUR = { x: 56, y: DEF_Y + 36 }, MGP = { x: W - 56, y: DEF_Y + 36 };
const turInterval = () => Math.max(0.3, 1.2 * Math.pow(0.86, S.turLv - 1)) * rapidMul();
const turDmg      = () => (4 + 3 * (S.turLv - 1)) * powMul();
const mgInterval  = () => Math.max(0.04, 0.2 * Math.pow(0.88, S.mgLv - 1)) * rapidMul();
const mgDmg       = () => (0.6 + 0.45 * (S.mgLv - 1)) * powMul();

const rand = (a, b) => a + Math.random() * (b - a);

// Nouveaux types d'ennemis ajoutés (runner, tank, shield, kamikaze, boss)
function makeEnemy(type, x, y, w, hp0, speed) {
  const e = { x, y, ph: rand(0, 6), flash: 0, type, boss: false, m: 1, r: 13, hp: hp0, speed: speed * rand(0.9, 1.1), shield: 0 };
  if (type === 'runner') { e.r = 10; e.hp = Math.max(1, Math.round(hp0 * 0.6)); e.speed = speed * 2.1; e.m = 0.8; e.coin = Math.ceil(e.hp / 2) + 1 + Math.floor(w / 4); }
  else if (type === 'tank') { e.r = 18; e.hp = Math.max(5, hp0 * 4); e.speed = speed * 0.6; e.m = 0.4; e.coin = Math.ceil(e.hp / 1.5) + 2; }
  else if (type === 'shield') { e.r = 15; e.hp = Math.max(3, hp0 * 2); e.shield = Math.max(2, Math.round(hp0)); e.speed = speed * 0.75; e.m = 0.6; e.coin = Math.ceil(e.hp / 1.5) + 3; }
  else if (type === 'kamikaze') { e.r = 11; e.hp = Math.max(1, Math.round(hp0 * 0.4)); e.speed = speed * 2.5; e.m = 0.5; e.coin = Math.ceil(e.hp / 2) + 2; }
  else if (type === 'boss') { e.boss = true; e.r = 30; e.hp = Math.round(20 + 12 * w + 1.2 * w * w); e.speed = speed * 0.45; e.m = 0.15; e.coin = Math.ceil(e.hp / 2.5); }
  else e.coin = Math.max(1, Math.ceil(hp0 / 2)) + Math.floor(w / 4);
  e.max = e.hp;
  return e;
}

function spawnWave() {
  S.wave++; S.cleared = false;
  const w = S.wave;
  const cols = 7, gap = (W - 80) / (cols - 1);
  const count = Math.min(6 + w * 4, 100);
  const rows = Math.ceil(count / cols);
  const hasBoss = w % 3 === 0;
  const hp0 = Math.max(1, Math.round(1 + (w - 1) * 0.5 + (w - 1) * (w - 1) * 0.03));
  const speed = Math.min(28 + w * 3.5, 90);
  const pRun = w < 2 ? 0 : Math.min(0.25, 0.06 + (w - 2) * 0.02);
  const pTank = w < 3 ? 0 : Math.min(0.12, 0.03 + (w - 3) * 0.01);
  const pShield = w < 2 ? 0 : Math.min(0.15, 0.04 + (w - 2) * 0.015);
  const pKAMI = w < 4 ? 0 : Math.min(0.12, 0.02 + (w - 4) * 0.01);
  let n = 0;
  for (let r = 0; r < rows && n < count; r++) {
    for (let c = 0; c < cols && n < count; c++, n++) {
      const x = 40 + c * gap + (r % 2 ? gap * 0.3 : 0) + rand(-6, 6), y = -30 - r * 40 + rand(-6, 6), q = Math.random();
      let type = 'grunt';
      if (q < pTank) type = 'tank';
      else if (q < pTank + pRun) type = 'runner';
      else if (q < pTank + pRun + pShield) type = 'shield';
      else if (q < pTank + pRun + pShield + pKAMI) type = 'kamikaze';
      S.enemies.push(makeEnemy(type, x, y, w, hp0, speed));
    }
  }
  if (hasBoss) S.enemies.push(makeEnemy('boss', W / 2, -30 - rows * 40 - 34, w, hp0, speed));
  S.banner = { text: hasBoss ? `Vague ${w} – Boss !` : `Vague ${w}`, t: 2 };
  SFX.wave(hasBoss); if (hasBoss) S.shake = Math.max(S.shake, 0.25);
  const th = themeFor(w), changed = th !== S.theme;
  if (changed) { S.prevTheme = S.theme; S.theme = th; S.fade = 1; S.flash = 1; S.shake = Math.max(S.shake, 0.3); SFX.zone(); }
  else S.flash = Math.max(S.flash, 0.3);
  if (changed || w === 1) S.zone = { text: ZONES[th], t: 3 };
}

function pointerX(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) * (W / r.width);
}
canvas.addEventListener('pointermove', e => { if (mode === 'play') S.tx = pointerX(e); });
canvas.addEventListener('pointerdown', e => {
  SFX.init();
  canvas.setPointerCapture(e.pointerId);
  const r = canvas.getBoundingClientRect(), px = pointerX(e), py = (e.clientY - r.top) * (H / r.height);
  if (Math.hypot(px - MUTE.x, py - MUTE.y) < 22) { SFX.toggle(); return; }
  if (mode === 'play') { if (!tapPowerUp(px, py)) S.tx = px; }
  else if (mode === 'pause') mode = 'play';
  else if (mode === 'menu' || (mode === 'over' && performance.now() - overAt > 700)) startGame();
});

const keys = {};
addEventListener('keydown', e => {
  SFX.init(); keys[e.key] = true;
  if (e.key === 'm' || e.key === 'M') SFX.toggle();
  if (mode === 'draft') { if (e.key >= '1' && e.key <= '3') pickPerk(+e.key - 1); return; }
  if (e.key === 'u' || e.key === 'U') useUlt();
  if (e.key === '1') buy('dmg');
  if (e.key === '2') buy('rate');
  if (e.key === '3') buy('gun');
  if (e.key === '4') buy('tur');
  if (e.key === '5') buy('mg');
  if (e.key === 'p' || e.key === 'P') togglePause();
  if ((e.key === ' ' || e.key === 'Enter') && (mode === 'menu' || (mode === 'over' && performance.now() - overAt > 700))) startGame();
});
addEventListener('keyup', e => { keys[e.key] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') mode = 'pause'; });

function togglePause() {
  if (mode === 'play') mode = 'pause';
  else if (mode === 'pause') mode = 'play';
}
document.getElementById('b-pause').addEventListener('click', () => { if (mode === 'play' || mode === 'pause') togglePause(); });

function startGame() { reset(); mode = 'play'; draftEl.hidden = true; }

const btn = { dmg:document.getElementById('b-dmg'), rate:document.getElementById('b-rate'), gun:document.getElementById('b-gun'),
              tur:document.getElementById('b-tur'), mg:document.getElementById('b-mg') };
const KEY = { dmg:'dmgLv', rate:'rateLv', gun:'gunLv', tur:'turLv', mg:'mgLv' };
const LABEL = { dmg:'Puissance', rate:'Cadence', gun:'Arme', tur:'Tourelle', mg:'Mitrailleuse' };
const lvOf = k => S[KEY[k]];
const maxOf = k => k === 'gun' ? WEAPONS.length : (k === 'tur' || k === 'mg') ? MAX_AUX : MAX_STAT;
const tierOf = lv => Math.max(1, Math.min(4, lv));

function subOf(k, lv) {
  if (k === 'gun') return WEAPONS[lv - 1].name;
  if (k === 'tur') return lv ? `Niv. ${lv} · ${TIER_T[tierOf(lv) - 1]}` : 'non achetée';
  if (k === 'mg')  return lv ? `Niv. ${lv} · ${TIER_M[tierOf(lv) - 1]}` : 'non achetée';
  return 'Niv. ' + lv;
}
function iconOf(k, lv) {
  if (k === 'tur') return lv ? ICON_T[tierOf(lv) - 1] : '🏗️';
  if (k === 'mg')  return '🔫';
  return k === 'gun' ? '🎯' : k === 'dmg' ? '💥' : '⚡';
}

function buy(k) {
  if (mode !== 'play') return;
  const lv = lvOf(k);
  if (lv >= maxOf(k)) return;
  const c = COST[k](lv);
  if (S.coins < c) return;
  S.coins -= c; S[KEY[k]]++; SFX.buy();
  const nv = S[KEY[k]];
  const pos = k === 'tur' ? TUR : k === 'mg' ? MGP : { x: S.px, y: PLAYER_Y };

function update(dt) {
  if (S.slowT > 0) { S.slowT -= dt; dt *= 0.35; }
  S.t += dt;

  if (keys.ArrowLeft || keys.a || keys.q) S.tx -= 420 * dt;
  if (keys.ArrowRight || keys.d) S.tx += 420 * dt;
  S.tx = Math.max(24, Math.min(W - 24, S.tx));
  S.px += (S.tx - S.px) * Math.min(1, dt * 16);

  S.cd -= dt;
  if (S.cd <= 0) { fire(); SFX.shoot(); S.cd += interval(); if (S.cd < 0) S.cd = 0; }
  updateAux(dt); updatePowerUps(dt); updateStrikes(dt);

  for (const b of S.bullets) {
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt;
    for (const e of S.enemies) {
      if (e.hp <= 0 || b.dead) continue;
      const rr = e.r + 4;
      if (segDist2(b.px, b.py, b.x, b.y, e.x, e.y) <= rr * rr) {
        // Gestion spéciale du bouclier
        if (e.shield > 0) {
          e.shield -= b.d; b.dead = true; e.flash = 0.08;
          burst(b.x, b.y, '#50a0ff', 4, 100);
          SFX.hit();
          if (e.shield <= 0) floatText(e.x, e.y - e.r - 10, 'Bouclier brisé !', '#7df0ff', 14);
          continue;
        }
        e.hp -= b.d; e.flash = 0.08; b.dead = true;
        burst(b.x, b.y, b.color, b.splash ? 8 : 3, b.splash ? 170 : 100);
        SFX.hit();
        if ((b.crit || b.w >= 9 || e.boss || e.type === 'tank') && S.t - (e.lt || 0) > 0.12) {
          e.lt = S.t; floatText(e.x + rand(-8, 8), e.y - e.r - 6, (b.crit ? '' : '-') + Math.max(1, Math.round(b.d)) + (b.crit ? '!' : ''), b.crit ? '#ffef6b' : '#fff', b.crit ? 20 : 13, 0.6);
        }
        if (e.hp <= 0) killEnemy(e);
        if (b.splash) for (const o of S.enemies) {
          if (o !== e && o.hp > 0 && (o.x - b.x) ** 2 + (o.y - b.y) ** 2 < b.splash * b.splash) {
            o.hp -= b.d * 0.5; o.flash = 0.08; if (o.hp <= 0) killEnemy(o);
          }
        }
      }
    }
    if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) b.dead = true;
  }
  S.bullets = S.bullets.filter(b => !b.dead);

  const E = S.enemies;
  for (const e of E) {
    e.y += e.speed * dt * (S.temp.slow > 0 ? 0.8 : 1);
    e.x += Math.sin(S.t * 2.2 + e.ph) * 12 * dt;
    e.flash = Math.max(0, e.flash - dt);
  }
  for (let i = 0; i < E.length; i++) {
    for (let j = i + 1; j < E.length; j++) {
      const a = E[i], b = E[j];
      const dx = b.x - a.x, dy = b.y - a.y, min = (a.r + b.r) * 0.85, d2 = dx * dx + dy * dy;
      if (d2 < min * min && d2 > 0.01) {
        const d = Math.sqrt(d2), push = (min - d) * 0.5;
        const wa = a.m, wb = b.m, ws = wa + wb;
        a.x -= dx / d * push * (wa / ws) * 1.6; b.x += dx / d * push * (wb / ws) * 1.6;
        a.y -= dy / d * push * (wa / ws) * 0.5; b.y += dy / d * push * (wb / ws) * 0.5;
      }
    }
    E[i].x = Math.max(E[i].r, Math.min(W - E[i].r, E[i].x));
  }

  for (const e of E) {
    if (e.hp > 0 && e.y - e.r * 0.4 > DEF_Y) {
      const loss = e.boss ? 2 : 1;
      S.lives -= loss; S.hurt = 0.4; S.shake = 0.3; e.hp = 0; SFX.hurt();
      if (e.type === 'kamikaze') { bombBlast(); } // Explosion kamikaze à l'impact
      burst(e.x, DEF_Y, '#ff4d6d', 14, 200);
      floatText(e.x, DEF_Y - 20, '-' + loss + ' ❤', '#ff4d6d');
    }
  }
  S.enemies = E.filter(e => e.hp > 0);

  if (S.lives <= 0) {
    S.lives = 0; mode = 'over'; overAt = performance.now(); SFX.over();
    if (S.score > best) { best = S.score; try { localStorage.setItem('foule-best', best); } catch (e) {} }
  }

  if (S.enemies.length === 0) {
    if (!S.cleared) {
      S.cleared = true; S.rest = 3;
      const bonus = 8 + S.wave * 3; S.coins += bonus; S.score += S.wave * 50;
      S.banner = { text: `Vague ${S.wave} terminée !`, t: 2.2 };
      floatText(W / 2, H * 0.36, '+' + bonus + ' 🪙 bonus', '#ffd54a', 22, 1.6); SFX.clear();
      S.temp.explo = Math.max(0, S.temp.explo - 1); S.temp.slow = Math.max(0, S.temp.slow - 1);
      showDraft();
    }
    S.rest -= dt;
    if (S.rest <= 0) spawnWave();
  }

  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const f of S.floats) { f.y -= 40 * dt; f.life -= dt; }
  S.floats = S.floats.filter(f => f.life > 0);
  if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }
  if (S.zone) { S.zone.t -= dt; if (S.zone.t <= 0) S.zone = null; }
  S.fade = Math.max(0, S.fade - dt / 1.2); S.ultCd = Math.max(0, S.ultCd - dt);
  S.shake = Math.max(0, S.shake - dt); S.hurt = Math.max(0, S.hurt - dt); S.flash = Math.max(0, S.flash - dt * 1.5); S.rapid = Math.max(0, S.rapid - dt);
}

function txt(s, x, y, size, color, align) {
  ctx.font = `800 ${size}px "Trebuchet MS",sans-serif`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,20,5,.85)'; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function drawHUD() {
  ctx.fillStyle = 'rgba(70,42,20,.88)'; ctx.fillRect(0, 0, W, 66);
  ctx.fillStyle = '#2d1b0c'; ctx.fillRect(0, 66, W, 3);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.roundRect(10, 8, 120, 30, 15); ctx.fill();
  ctx.fillStyle = '#ffc928'; ctx.beginPath(); ctx.arc(28, 23, 11, 0, 7); ctx.fill();
  ctx.strokeStyle = '#a36b00'; ctx.lineWidth = 3; ctx.stroke();
  txt(String(S.coins), 46, 24, 22, '#fff', 'left');
  txt('Vague ' + Math.max(1, S.wave), W / 2 + 20, 23, 20, '#fff');
  txt('Score ' + S.score, W - 12, 23, 18, '#ffe9a8', 'right');
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(MUTE.x, MUTE.y, 17, 0, 7); ctx.fill();
  txt(SFX.muted ? '🔇' : '🔊', MUTE.x, MUTE.y + 1, 18, '#fff');
  const bf = [];
  if (S.rapid > 0) bf.push(`⚡ ${Math.ceil(S.rapid)} s`);
  if (S.temp.explo) bf.push(`🧨 ${S.temp.explo} vague${S.temp.explo > 1 ? 's' : ''}`);
  if (S.temp.slow) bf.push(`🧊 ${S.temp.slow} vague${S.temp.slow > 1 ? 's' : ''}`);
  if (bf.length) txt(bf.join('   '), W / 2, 88, 15, '#ffe27a');
  txt(`Arme ${S.gunLv} · Tourelle ${S.turLv || '–'} · Mitr. ${S.mgLv || '–'}`, 12, 53, 14, '#cfe3ff', 'left');
  txt('❤'.repeat(S.lives) + '♡'.repeat(MAX_LIVES - S.lives), W - 12, 53, 15, '#ff7d8f', 'right');
}

function overlay(title, lines) {
  ctx.fillStyle = 'rgba(20,40,60,.45)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#5a3a1e'; ctx.strokeStyle = '#2d1b0c'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.roundRect(40, H / 2 - 170, W - 80, 330, 22); ctx.fill(); ctx.stroke();
  txt(title, W / 2, H / 2 - 120, 42, '#ffd54a');
  lines.forEach((l, i) => txt(l, W / 2, H / 2 - 50 + i * 36, 19, '#fff'));
}

function render() {
  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-5, 5) * S.shake * 3, rand(-5, 5) * S.shake * 3);
  if (S.fade > 0) drawScene(S.prevTheme, 1);
  drawScene(S.theme, S.fade > 0 ? 1 - S.fade : 1);

  for (let x = 16, i = 0; x < W; x += 26, i++) {
    if (x < 96 || x > W - 96) continue;
    drawSoldier(x, DEF_Y + 20 + (i % 2) * 10, 9, '#2f6fe0', '#1c4aa8', Math.sin(S.t * 6 + i) * .8, false);
  }
  drawEmplacements();

  [...S.enemies].sort((a, b) => a.y - b.y).forEach(drawEnemy);
  for (const b of S.bullets) {
    ctx.lineCap = 'round'; ctx.strokeStyle = '#3b2412'; ctx.lineWidth = (b.w || 3.5) + 2.5;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.022, b.y - b.vy * 0.022); ctx.stroke();
    ctx.strokeStyle = b.color; ctx.lineWidth = b.w || 3.5; ctx.stroke();
  }
  drawPlayer();
  drawFx();

  for (const p of S.parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2.5, p.y - 2.5, 5, 5); }
  ctx.globalAlpha = 1;
  for (const f of S.floats) { ctx.globalAlpha = Math.min(1, f.life * 1.6); txt(f.text, f.x, f.y, f.size || 16, f.color); }
  ctx.globalAlpha = 1;
  if (mode === 'play' && S.enemies.length === 0 && S.wave > 0) {
    txt(`Vague ${S.wave + 1} dans ${Math.ceil(Math.max(0, S.rest))}`, W / 2, H * 0.44, 28, '#fff');
    txt((S.wave + 1) % 3 === 0 ? '⚠ Un boss ferme la marche !' : 'Profite de la pause pour t’équiper', W / 2, H * 0.44 + 36, 17, (S.wave + 1) % 3 === 0 ? '#ffb3b3' : '#e8f4ff');
  }
  if (S.banner) { ctx.globalAlpha = Math.min(1, S.banner.t); txt(S.banner.text, W / 2, H * 0.3, 40, '#fff'); ctx.globalAlpha = 1; }
  if (S.zone) { ctx.globalAlpha = Math.min(1, S.zone.t); txt(S.zone.text, W / 2, H * 0.3 + 46, 22, '#ffe9a8'); ctx.globalAlpha = 1; }
  if (S.hurt > 0) { ctx.fillStyle = `rgba(255,60,90,${S.hurt * 0.5})`; ctx.fillRect(0, 0, W, H); }
  if (S.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${S.flash * 0.7})`; ctx.fillRect(0, 0, W, H); }
  drawHUD(); drawFly();
  ctx.restore();

  if (mode === 'menu') overlay('Foule en Furie', ['Glisse pour viser, le tir est automatique.', 'Achète une tourelle et une mitrailleuse !', 'Touche les bonus ⚡ 🪙 💣 en plein vol !', 'Ultime 🚀 : bouton rond ou touche U', 'Ne laisse aucun rouge passer la palissade !', 'Touche l’écran pour jouer']);
  if (mode === 'pause') overlay('Pause', ['Jeu en pause', 'Touche le bouton ou appuie sur P pour reprendre']);
  if (mode === 'over') overlay('Défaite !', [`Vague ${S.wave} · Score ${S.score}`, `Record : ${best}`, 'Touche l’écran pour rejouer']);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (mode === 'play') update(dt);
  else if (mode === 'menu' || mode === 'draft') S.t += dt;
  render();
  refreshShop(); refreshUlt();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
